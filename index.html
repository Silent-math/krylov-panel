<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Krylov · Tablero</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2dc;
  --ok:#1f9d55;--warn:#d69e2e;--bad:#d64545;--info:#3b6fd4;--done:#9aa39d;
  --okbg:#e7f5ec;--warnbg:#fbf3e0;--badbg:#fbe9e9;--infobg:#e8effb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121211;--card:#1c1c1a;--ink:#ecebe7;--mute:#9b9a94;--line:#2e2e2b;
  --okbg:#15301f;--warnbg:#33290f;--badbg:#3a1a1a;--infobg:#17243d;--done:#5d655f;
}}
:root[data-theme="dark"]{
  --bg:#121211;--card:#1c1c1a;--ink:#ecebe7;--mute:#9b9a94;--line:#2e2e2b;
  --okbg:#15301f;--warnbg:#33290f;--badbg:#3a1a1a;--infobg:#17243d;--done:#5d655f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 0 8px}
code{font-size:12px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.sync{color:var(--mute);font-size:12px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.busy{background:var(--info)} .dot.slow{background:var(--warn)} .dot.off{background:var(--bad)}
.sync button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:2px 9px;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tile .k{font-size:11px;color:var(--mute)}
.tile .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.alerts{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.alert{border-radius:7px;padding:5px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert.bad{background:var(--badbg)} .alert.warn{background:var(--warnbg)} .alert.info{background:var(--infobg)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:900px){.roles{grid-template-columns:1fr}}
.role{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:4px solid var(--line);transition:box-shadow .4s}
.role.ok{border-top-color:var(--ok)} .role.warn{border-top-color:var(--warn)} .role.bad{border-top-color:var(--bad)}
.role.flash{box-shadow:0 0 0 3px var(--info)}
.role .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.role .head b{font-size:15px}
.role .sem{font-size:13px;white-space:nowrap}
.row{display:grid;grid-template-columns:64px 1fr;gap:6px;margin-top:6px;font-size:13px}
.row .k{color:var(--mute);font-size:12px;padding-top:1px}
.prog{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--info)}
.role .meta{font-size:12px;color:var(--mute);margin-top:8px}
details{margin-top:8px;font-size:12.5px}
details summary{cursor:pointer;color:var(--mute);font-size:12px}
details ul{margin:4px 0 0;padding-left:16px} details li{margin:2px 0}
.gantt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
.gin{position:relative;min-width:860px}
.gaxis{position:relative;height:18px;margin-left:56px;font-size:11px;color:var(--mute)}
.gaxis span{position:absolute;transform:translateX(-50%)}
.grow{display:flex;align-items:center;height:28px;border-top:1px solid var(--line)}
.grow .lab{width:56px;flex:none;font-size:12px;color:var(--mute)}
.grow .track{position:relative;flex:1;height:100%}
.bar{position:absolute;top:5px;height:18px;border-radius:4px;font-size:10px;line-height:18px;padding:0 3px;overflow:hidden;white-space:nowrap;color:#fff}
.bar.hecha{background:var(--done)} .bar.curso,.bar.ahora{background:var(--info)}
.bar.pasada{background:var(--warn)} .bar.atrasada{background:var(--bad)} .bar.pendiente{background:transparent;color:var(--mute);border:1px dashed var(--mute)}
.vline{position:absolute;top:0;bottom:0;border-left:2px solid var(--bad);z-index:2}
.vline.h{border-left:1px dashed var(--mute);z-index:1}
.vline .t{position:absolute;top:-16px;left:3px;font-size:10px;color:var(--bad);white-space:nowrap}
.vline.h .t{color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.feed{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.feed div{padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed div:last-child{border-bottom:0}
.feed .when{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums;margin-right:6px}
.tag{display:inline-block;font-size:10px;border-radius:4px;padding:0 5px;margin-right:6px;color:#fff;vertical-align:1px}
.tag.producto{background:#8b5cf6}.tag.amortizacion{background:#0e9f9a}.tag.seguimiento{background:#e07a1f}.tag.otro{background:var(--done)}
.full{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-top:20px}
.full .md h2{font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink)}
.full table{border-collapse:collapse;display:block;overflow-x:auto}
.full td,.full th{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Krylov · cómo vamos</h1>
    <div class="sync"><span class="dot busy" id="dot"></span><span id="sync">Cargando…</span><button id="btn" title="Revisar ahora">↻</button></div>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="alerts" id="alerts"></div>

  <h2>Los tres computadores</h2>
  <div class="roles" id="roles"></div>

  <h2>Plan del sábado</h2>
  <div class="gantt"><div class="gin" id="gantt"></div>
    <div class="legend">
      <span><i style="background:var(--done)"></i>hecha</span>
      <span><i style="background:var(--info)"></i>en curso</span>
      <span><i style="background:var(--warn)"></i>pasada de hora</span>
      <span><i style="background:var(--bad)"></i>atrasada (más del doble: cortar o simplificar)</span>
      <span><i style="border:1px dashed var(--mute)"></i>pendiente</span>
    </div>
  </div>

  <h2>Últimos commits</h2>
  <div class="feed" id="feed"></div>

  <details class="full"><summary>Tablero completo (estado/TABLERO.md)</summary><div class="md" id="tablero"></div></details>
</main>

<script>
// PARSE-START
const REPO = 'platanus-hack/platanus-hack-26-cl-team-5';
const ROLES = [
  {id:'producto', pc:'PC 1', pre:'P', file:'estado/producto.md'},
  {id:'amortizacion', pc:'PC 2', pre:'A', file:'estado/amortizacion.md'},
  {id:'seguimiento', pc:'PC 3', pre:'S', file:'estado/seguimiento.md'},
];
const DAY0 = Date.parse('2026-11-21T00:00:00-03:00'); // sábado 00:00, Santiago (UTC-3)
const toMin = s => { const m = /(\d{1,2}):(\d{2})/.exec(s||''); return m ? +m[1]*60 + +m[2] : null; };
const fmt = m => String(Math.floor(m/60)%24).padStart(2,'0') + ':' + String(Math.round(m%60)).padStart(2,'0');

function sections(md){
  const out = {}; let cur = '_';
  for (const line of md.split('\n')){
    const h = /^##\s+(.+)$/.exec(line);
    if (h){ cur = h[1].trim(); out[cur] = []; continue; }
    (out[cur] ||= []).push(line);
  }
  for (const k in out) out[k] = out[k].join('\n').trim();
  return out;
}
const bullets = txt => (txt||'').split('\n').filter(l => /^\s*-\s+/.test(l)).map(l => l.replace(/^\s*-\s+/,''));
const isEmpty = txt => { const b = bullets(txt); return b.length === 0 || b.every(x => /^\(?ninguno\)?/i.test(x.trim())); };

// Una línea larga de markdown → una frase corta: sin hora, sin formato, hasta el primer punto, máx. n caracteres.
function short(s, n = 90){
  let t = (s||'').replace(/^[a-záéíóú]{3}\s+\d{1,2}:\d{2}\s*·\s*/i, '')
                 .replace(/\*\*|`|\*/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').trim();
  t = t.split(/\.\s+(?=[A-ZÁÉÍÓÚ¿(])/)[0].replace(/\.$/, '');
  if (t.length > n) t = t.slice(0, n).replace(/\s+\S*$/, '') + '…';
  return t;
}
const timeOf = s => (/^[a-záéíóú]{3}\s+(\d{1,2}:\d{2})/i.exec(s||'') || [])[1] || '';

function mentionedIds(txt){
  const ids = new Set();
  const re = /\b([PAS])-([A-Z]?)(\d+)\b(?:\s*(?:a|al|-|–)\s*\1-\2(\d+)\b)?/g;
  let m;
  while ((m = re.exec(txt||''))){
    const a = +m[3], b = m[4] ? +m[4] : a, w = m[3].length;
    for (let i = a; i <= Math.min(b, a+30); i++) ids.add(`${m[1]}-${m[2]}${String(i).padStart(w,'0')}`);
  }
  return ids;
}
// Hecha = el id aparece en el sujeto de una línea de «Hecho» (antes del primer punto o dos puntos).
function doneIds(hecho){
  const ids = new Set();
  for (const b of bullets(hecho)){
    const head = b.replace(/^[a-záéíóú]{3}\s+\d{1,2}:\d{2}\s*·\s*/i,'').split(/[.:]/)[0].slice(0,60);
    for (const id of mentionedIds(head)) ids.add(id);
  }
  return ids;
}
function parseTasks(workplan){
  const tasks = [];
  for (const line of workplan.split('\n')){
    const m = /^\|\s*([PAS]-[A-Z0-9]+)\s*\|([^|]*)\|([^|]*)\|([^|]*)\|/.exec(line);
    if (!m) continue;
    const when = m[2].trim(), start = /^\d{1,2}:\d{2}$/.test(when) ? toMin(when) : null, dur = parseInt(m[3]) || null;
    const desc = (start === null && when.length > 12 ? when : m[4]).replace(/\*\*|`|\*/g,'').trim();
    tasks.push({id:m[1], when, start, dur, desc, night: start === null});
  }
  return tasks;
}
function parseHitos(workplan){
  const h = {}; let m;
  const re1 = /\*\*(H\d)\s*·\s*(\d{1,2}:\d{2})\*\*/g;
  while ((m = re1.exec(workplan))) h[m[1]] = {id:m[1], t:toMin(m[2])};
  const re2 = /\*\*(H\d)\s*·[^·*]+·\s*([^*]+)\*\*/g;
  while ((m = re2.exec(workplan))) if (h[m[1]]) h[m[1]].q = m[2].trim();
  const d = /\*\*Antes de dormir\s*·\s*(\d{1,2}:\d{2})/.exec(workplan);
  const list = Object.values(h);
  if (d) list.push({id:'dormir', t:toMin(d[1]), q:'Antes de dormir'});
  return list.filter(x => x.t !== null).sort((a,b) => a.t - b.t);
}
function status(task, done, inProgress, now){
  if (done.has(task.id)) return 'hecha';
  if (inProgress.has(task.id)) return 'curso';
  if (task.night) return 'pendiente';
  const d = task.dur || 30;
  if (now >= task.start + 2*d) return 'atrasada';
  if (now >= task.start + d) return 'pasada';
  if (now >= task.start) return 'ahora';
  return 'pendiente';
}
// Tabla «Entrenamiento en curso» → {motor, desde, hasta}
function training(txt){
  if (!txt) return null;
  const rows = {};
  for (const l of txt.split('\n')){ const c = l.split('|').map(x => x.trim()); if (c.length > 3) rows[c[1]] = c[2]; }
  const motorK = Object.keys(rows).find(k => /^Motor/.test(k)), inicioK = Object.keys(rows).find(k => /^Hora de inicio/.test(k));
  const motor = (/`([^`]+)`/.exec(rows[motorK]||'') || [])[1];
  if (!motor) return null;
  const desde = toMin(rows[inicioK]);
  const hasta = toMin((/--hasta\s+(\d{1,2}:\d{2})/.exec(txt) || [])[1] || (/hasta las (\d{1,2}:\d{2})/.exec(txt) || [])[1]);
  return {motor, desde, hasta};
}
function commitRole(c, learned){
  const msg = c.commit.message.split('\n')[0], name = c.commit.author.name;
  const m = /^estado\s+(producto|amortizacion|seguimiento)\b/i.exec(msg);
  if (m){ learned[name] = m[1].toLowerCase(); return learned[name]; }
  if (/^(ronda|H\d\b|tablero|hito)/i.test(msg)) return 'seguimiento';
  return learned[name] || null;
}
// PARSE-END

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowMin = () => (Date.now() - DAY0) / 60000;
const ago = ms => { const m = Math.round((Date.now()-ms)/60000); return m < 1 ? 'recién' : m < 60 ? `hace ${m} min` : `hace ${Math.floor(m/60)} h ${m%60} min`; };
const hhmm = ms => new Date(ms).toLocaleTimeString('es-CL',{timeZone:'America/Santiago',hour:'2-digit',minute:'2-digit'});
const sleeping = n => n >= toMin('05:15') && n < toMin('08:15');

// ---- Sincronización: solo se recarga cuando hay un commit nuevo ----
// Cada cierto tiempo se pregunta a GitHub por el último commit (respuesta de 40 caracteres).
// Si cambió, se leen los archivos de ese commit y se redibuja. Si no, no se hace nada.
// Pestaña oculta: no pregunta. Al volver a la pestaña: pregunta al tiro.
// Token opcional (#token=… una vez; queda en este navegador) para no chocar con el límite de 60/h por red.
let TOKEN = '';
try{
  const m = /token=([\w-]+)/.exec(location.hash);
  if (m){ localStorage.setItem('gh_token', m[1]); history.replaceState(null, '', location.pathname); }
  TOKEN = localStorage.getItem('gh_token') || '';
}catch(e){}
const AUTH = TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {};
let data = null, sha = null, lastCheck = 0, nextCheck = 0, rate = null, checking = false, unseen = 0;
const interval = () => TOKEN ? 20e3 : (rate !== null && rate < 15 ? 300e3 : 90e3);

async function check(force){
  if (checking) return; checking = true;
  $('dot').className = 'dot busy';
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits/main`, {cache:'no-cache', headers:{Accept:'application/vnd.github.sha', ...AUTH}});
    const rem = r.headers.get('x-ratelimit-remaining'); if (rem !== null) rate = +rem;
    if (!r.ok) throw new Error(r.status);
    const s = (await r.text()).trim();
    lastCheck = Date.now();
    if (s !== sha || force) await load(s, sha !== null && s !== sha);
  }catch(e){
    lastCheck = Date.now();
    if (!data) await load('main', false); // sin API: se leen los archivos igual (con hasta 5 min de atraso)
  }
  checking = false;
  nextCheck = Date.now() + interval();
  render(); tick();
}

async function load(newSha, isNew){
  let commits = null;
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits?per_page=30`, {cache:'no-cache', headers:AUTH});
    if (r.ok) commits = await r.json();
  }catch(e){}
  const ref = commits?.[0]?.sha || newSha;
  const raw = p => fetch(`https://raw.githubusercontent.com/${REPO}/${ref}/${p}`, {cache: ref==='main' ? 'no-cache' : 'default'})
                    .then(r => r.ok ? r.text() : '').catch(() => '');
  const [tablero, workplan, ...estados] = await Promise.all(['estado/TABLERO.md','WORKPLAN.md', ...ROLES.map(r => r.file)].map(raw));
  const prevTop = data?.commits?.[0]?.sha;
  data = {commits, tablero, workplan, estados};
  sha = ref;
  if (isNew && commits){
    const fresh = []; for (const c of commits){ if (c.sha === prevTop) break; fresh.push(c); }
    data.fresh = new Set(fresh.map(c => c.sha));
    if (document.hidden){ unseen += fresh.length || 1; document.title = `(${unseen}) Krylov · Tablero`; }
  }
}

function render(){
  if (!data) return;
  const {commits, tablero, workplan, estados} = data;
  const now = nowMin();
  const tabSec = sections(tablero);
  const est = estados.map(sections);

  const sem = {};
  for (const line of (tabSec['Semáforo']||'').split('\n')){
    const c = line.split('|').map(x => x.trim());
    const r = ROLES.find(r => c[1] && c[1].toLowerCase().startsWith(r.id));
    if (r) sem[r.id] = {estado:c[2], nota:c[3], cls: /🔴/.test(c[2]) ? 'bad' : /🟡|🟠/.test(c[2]) ? 'warn' : /🟢/.test(c[2]) ? 'ok' : ''};
  }
  const sig = {};
  for (const b of bullets(tabSec['Siguiente tarea de cada uno'])){
    const r = ROLES.find(r => b.includes(r.pc));
    if (r) sig[r.id] = b.replace(/^\*\*[^*]*\*\*\s*/, '');
  }

  const done = new Set(), prog = new Set();
  est.forEach(s => { doneIds(s['Hecho']).forEach(id => done.add(id)); mentionedIds(s['En curso']).forEach(id => prog.add(id)); });
  const tasks = parseTasks(workplan).map(t => ({...t, st: status(t, done, prog, now)}));
  const hitos = parseHitos(workplan);

  const learned = {}, lastByRole = {};
  const cs = (commits||[]).slice().reverse().map(c => ({c, role: null}));
  cs.forEach(x => x.role = commitRole(x.c, learned));
  cs.forEach(x => { if (!x.role) x.role = learned[x.c.commit.author.name] || null; });
  cs.reverse();
  for (const x of cs) if (x.role && !lastByRole[x.role]) lastByRole[x.role] = Date.parse(x.c.commit.committer.date);
  const freshRoles = new Set(cs.filter(x => data.fresh?.has(x.c.sha)).map(x => x.role));

  // Indicadores
  const updated = /\*\*Actualizado:\*\*\s*([^·\n]+)/.exec(tablero)?.[1]?.trim() || '';
  const tu = toMin(updated);
  const nextH = hitos.find(h => h.t > now);
  $('tiles').innerHTML = [
    ['Producto terminado (sáb 18:00)', `<span data-cd="2026-11-21T18:00:00-03:00"></span>`],
    ['Entrega (dom 08:30)', `<span data-cd="2026-11-22T08:30:00-03:00"></span>`],
    [nextH ? `Próximo: ${nextH.id === 'dormir' ? 'dormir' : nextH.id} a las ${fmt(nextH.t)}` : 'Hitos', nextH ? `en ${Math.round(nextH.t-now)} min` : 'listos'],
    ['Tablero de PC 3', tu !== null ? `hace ${Math.max(0, Math.round(now - tu))} min` : '—'],
  ].map(([k,v]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`).join('');

  // Alertas: una línea cada una
  const al = [];
  ROLES.forEach((r,i) => {
    const s = est[i];
    if (!isEmpty(s['Bloqueos'])) al.push(['bad', `${r.pc} bloqueado: ${short(bullets(s['Bloqueos'])[0], 110)}`]);
    const lc = lastByRole[r.id];
    if (commits && lc && (Date.now()-lc) > 45*60e3 && !sleeping(now)) al.push(['warn', `${r.pc} sin commits ${ago(lc)}`]);
  });
  if (tu !== null && now - tu > 30 && !sleeping(now)) al.push(['warn', `Tablero sin actualizar hace ${Math.round(now-tu)} min`]);
  tasks.filter(t => t.st === 'atrasada').forEach(t => al.push(['bad', `${t.id} atrasada (desde ${t.when}, ${t.dur} min): ${short(t.desc, 80)}`]));
  $('alerts').innerHTML = al.map(([c,h]) => `<div class="alert ${c}" title="${esc(h)}">${esc(h)}</div>`).join('');

  // Tarjetas
  $('roles').innerHTML = ROLES.map((r,i) => {
    const s = est[i], sm = sem[r.id] || {};
    const persona = /Persona:\s*([^·\n]+)/.exec(estados[i])?.[1]?.trim().replace(/^\[.*\]$/, '') || '';
    const curso = bullets(s['En curso']).slice(-2);
    const tr = training(s['Entrenamiento en curso']);
    const nextPlan = tasks.filter(t => t.id.startsWith(r.pre+'-') && !t.night && t.st !== 'hecha').sort((a,b) => a.start-b.start)[0];
    const lc = lastByRole[r.id];
    const row = (k, v) => v ? `<div class="row"><div class="k">${k}</div><div>${v}</div></div>` : '';
    let trHtml = '';
    if (tr){
      const p = tr.desde !== null && tr.hasta !== null ? Math.min(100, Math.max(0, (now - tr.desde) / (tr.hasta - tr.desde) * 100)) : null;
      trHtml = row('Entrena', `<b>${esc(tr.motor)}</b> ${tr.desde!==null?fmt(tr.desde):''} → ${tr.hasta!==null?fmt(tr.hasta):'?'}${p!==null ? `<div class="prog"><i style="width:${p.toFixed(0)}%"></i></div>` : ''}`);
    }
    const hechos = bullets(s['Hecho']).slice(-4).reverse();
    const pedidos = isEmpty(s['Pedidos a otros']) ? [] : bullets(s['Pedidos a otros']).slice(-3);
    return `<div class="role ${sm.cls||''} ${freshRoles.has(r.id) ? 'flash' : ''}">
      <div class="head"><b>${r.pc} · ${r.id}</b><span class="sem">${esc(sm.estado||'')}</span></div>
      ${row('Ahora', curso.map(x => esc(short(x, 85))).join('<br>'))}
      ${row('Sigue', esc(sig[r.id] ? short(sig[r.id], 85) : nextPlan ? `${nextPlan.id} · ${short(nextPlan.desc, 70)}` : ''))}
      ${trHtml}
      <div class="meta">${persona ? esc(persona) + ' · ' : ''}último commit ${lc ? ago(lc) : '—'}</div>
      <details><summary>Más</summary>
        ${hechos.length ? `<b>Hecho</b><ul>${hechos.map(x => `<li>${esc(timeOf(x))} ${esc(short(x, 100))}</li>`).join('')}</ul>` : ''}
        ${pedidos.length ? `<b>Pide</b><ul>${pedidos.map(x => `<li>${esc(short(x, 100))}</li>`).join('')}</ul>` : ''}
        ${sm.nota ? `<b>Nota del tablero</b><ul><li>${esc(short(sm.nota, 140))}</li></ul>` : ''}
      </details>
    </div>`;
  }).join('');

  // Línea de tiempo
  const T0 = toMin('03:00'), T1 = toMin('18:30'), pct = m => ((m - T0) / (T1 - T0) * 100).toFixed(2) + '%';
  let g = '<div class="gaxis">';
  for (let h = 3; h <= 18; h++) g += `<span style="left:${pct(h*60)}">${String(h).padStart(2,'0')}</span>`;
  g += '</div><div style="position:relative">';
  ROLES.forEach(r => {
    g += `<div class="grow"><div class="lab">${r.pc}</div><div class="track">`;
    tasks.filter(t => t.id.startsWith(r.pre+'-') && !t.night).forEach(t => {
      const w = Math.max(t.dur || 20, 6);
      g += `<div class="bar ${t.st}" style="left:${pct(t.start)};width:calc(${(w/(T1-T0)*100).toFixed(2)}% - 2px)" title="${esc(t.id+' · '+t.when+' · '+(t.dur||'?')+' min\n'+short(t.desc, 160))}">${t.id}</div>`;
    });
    g += '</div></div>';
  });
  g += '<div style="position:absolute;inset:0 0 0 56px;pointer-events:none">';
  hitos.forEach(h => g += `<div class="vline h" style="left:${pct(h.t)}"><span class="t">${h.id==='dormir'?'zzz':h.id}</span></div>`);
  if (now > T0 && now < T1) g += `<div class="vline" style="left:${pct(now)}"><span class="t">${fmt(now)}</span></div>`;
  g += '</div></div>';
  $('gantt').innerHTML = g;

  // Commits: una línea cada uno
  $('feed').innerHTML = commits ? cs.slice(0,8).map(({c, role}) => {
    const t = Date.parse(c.commit.committer.date);
    return `<div title="${esc(c.commit.message.split('\n')[0])}"><span class="when">${hhmm(t)}</span><span class="tag ${role||'otro'}">${role ? ROLES.find(r => r.id===role).pc : '—'}</span>${esc(c.commit.message.split('\n')[0])}</div>`;
  }).join('') : '<div>Lista de commits no disponible (límite de GitHub para esta red).</div>';

  const tabMd = tablero.replace(/^#\s.*\n/, '');
  $('tablero').innerHTML = DOMPurify.sanitize(marked.parse(tabMd || '_No se pudo leer._'));
}

function cd(t){ const s = Math.max(0, Math.round((t - Date.now())/1000)); return `${Math.floor(s/3600)} h ${String(Math.floor(s%3600/60)).padStart(2,'0')} min`; }
function tick(){
  document.querySelectorAll('[data-cd]').forEach(el => el.textContent = cd(Date.parse(el.dataset.cd)));
  if (!lastCheck) return;
  const slow = !TOKEN && rate !== null && rate < 15;
  $('dot').className = 'dot ' + (checking ? 'busy' : document.hidden ? 'off' : slow ? 'slow' : '');
  $('sync').textContent = data
    ? `al día con ${sha && sha !== 'main' ? sha.slice(0,7) : 'main'}` +
      (data.commits?.[0] ? ` (commit ${ago(Date.parse(data.commits[0].commit.committer.date))})` : '') +
      ` · revisado ${ago(lastCheck)}` + (slow ? ' · modo ahorro' : '')
    : 'sin datos';
}
$('btn').onclick = () => check(true);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden){ unseen = 0; document.title = 'Krylov · Tablero'; check(); }
});
setInterval(() => { if (!document.hidden && Date.now() >= nextCheck) check(); }, 5e3);
setInterval(tick, 15e3);
setInterval(render, 60e3); // solo reloj y colores; no consulta nada
check();
</script>
</body>
</html>
